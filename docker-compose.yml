# 머물멍을 컨테이너 하나로 띄워요: http://localhost:3000
#
#   docker compose up -d --build     시작 (처음에는 이미지를 만들어요)
#   docker compose logs -f           로그 보기
#   docker compose down              내리기 (제안서와 실행 기록은 볼륨에 남아요)
#
# 이 PC의 Ollama(로컬 LLM)를 쓰려면 docker-compose.local-llm.yml 을 겹쳐서 띄워요.
name: meomulmeong

services:
  app:
    build: .
    image: meomulmeong:local
    container_name: meomulmeong
    ports:
      - "127.0.0.1:3000:3000" # 이 PC 안에서만 열어요. 로그인 기능이 없어서 밖으로는 열지 않아요.
    env_file:
      # API 키 같은 값은 이미지에 넣지 않고, 실행할 때 backend/.env 에서 읽어 넘겨요. 파일이 없어도 떠요.
      - path: backend/.env
        required: false
    environment:
      TZ: Asia/Seoul
      # 컨테이너 안의 127.0.0.1 은 컨테이너 자신이라, 호스트의 Ollama 는 이 주소로 불러요.
      # 호스트의 Ollama 가 127.0.0.1 에서만 듣고 있으면 닿지 않아요 (docker-compose.local-llm.yml 참고).
      MEOMUL_OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - outputs:/app/backend/outputs # 최종 제안서, 실행 기록, 평가 보고서

volumes:
  outputs:
