# 머물멍을 컨테이너 하나로 띄워요: http://localhost:3000
#
#   docker compose up -d --build     시작 (처음에는 이미지를 만들어요)
#   docker compose logs -f           로그 보기
#   docker compose down              내리기 (제안서와 실행 기록은 볼륨에 남아요)
#
# 클라우드 LLM(Claude)을 쓰려면 backend/.env 에 ANTHROPIC_API_KEY 를 넣고 다시 띄워요.
name: jeju-meomulmeong

services:
  app:
    build: .
    image: jeju-meomulmeong:0.1.0
    container_name: jeju-meomulmeong-app
    ports:
      - "127.0.0.1:3000:3000" # 이 PC 안에서만 열어요. 로그인 기능이 없어서 밖으로는 열지 않아요.
    env_file:
      # API 키 같은 값은 이미지에 넣지 않고, 실행할 때 backend/.env 에서 읽어 넘겨요. 파일이 없어도 떠요.
      - path: backend/.env
        required: false
    environment:
      TZ: Asia/Seoul
    volumes:
      - outputs:/app/backend/outputs # 최종 제안서, 실행 기록, 평가 보고서

volumes:
  outputs:
