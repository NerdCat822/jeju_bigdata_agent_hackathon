[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meomulmeong"
version = "0.1.0"
description = "머물멍 (Jeju Town Vitality Agent) 백엔드: 읍면동 활력 3단계 AI 에이전트 코어와 웹 API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# 클라우드 LLM(선택). 로컬·템플릿 모드에서는 필요 없어요.
cloud = ["anthropic>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
meomul = "meomulmeong.cli:main"

[tool.setuptools.packages.find]
include = ["meomulmeong*", "eval*"]

[tool.setuptools.package-data]
meomulmeong = ["agent/prompts/*.md", "report/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not cloud'"  # 실제 Claude API를 부르는 테스트는 기본 제외 (pytest -m cloud 로 실행, 요금이 나가요)
markers = [
    "cloud: 실제 Claude API를 부르는 테스트 (ANTHROPIC_API_KEY 필요, 기본 제외)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
