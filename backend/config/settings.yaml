# 머물멍 분석 설정 — 센터 담당자가 코드 없이 바꿀 수 있는 값이에요.
# 값을 바꾼 뒤에는 `python -m meomulmeong build-data` 를 다시 실행할 필요가 없어요 (분석 시점에 읽어요).
# 단, sources 아래 값은 적재 시점에 쓰이므로 바꾸면 build-data 를 다시 실행하세요.

analysis:
  youth_age_bands: [20, 30]   # 청년 = 20·30대
  tau: 0.03                   # 유형 분류 임계값 (±3%)
  period_months: 12           # 비교 기간: 최근 12개월(P1) vs 직전 12개월(P0)
  min_month_days: 20          # 월 일수가 이보다 적은 달은 지표에서 제외
  min_period_months: 9        # P1·P0 각각 유효한 달이 이보다 적으면 전년 동월 비교로 전환
  min_base_pop: 100           # 기준 인구(P0 청년 거주 일평균)가 이보다 작으면 '작은 표본'
  peers_k: 3                  # 유사 읍면 개수

stage2:
  min_share_for_growth: 0.03  # 국적 성장률 순위에 넣을 최소 비중
  max_suggestions: 3          # 한 번에 보여 줄 제안 개수

stage3:
  elasticity_default: 1.0             # 수요 탄력성 ε 기본값 (사용자 가정)
  elasticity_grid: [0.5, 1.0, 1.5]    # 민감도 표에 항상 함께 보여 줄 ε
  supply_change_default: -0.10        # 국내선 공급 변화율 기본 가정 (-10%)
  beta_min_r2: 0.5                    # 노선 관광 민감도 채택 기준 R²
  beta_min_months: 12                 # 회귀에 필요한 최소 월 수
  max_courses: 3                      # 코스 제안 개수
  max_transfers: 1                    # 환승 횟수 상한

verify:
  max_retries: 2              # 해설 검증 실패 시 재생성 횟수
  number_rel_tol: 0.005       # 숫자 대조 상대 오차 허용 (반올림 외 여유)

llm:
  explain: true               # false 로 두면 해설은 항상 규칙 문장(템플릿)이고, LLM은 질문 해석과 자유 질문에만 써요
  evidence_max_rows: 40       # LLM에 넘기는 지표·결과 행 수 상한 (집계값만 전달)
  explain_budget_seconds: 45  # 해설 쓰기에 이만큼 쓰고도 검증을 통과하지 못하면 더 다시 쓰지 않고 템플릿 해설로 대체해요 (0 이면 한도 없음)
  # 목록이 들어가는 답은 LLM 모드에서도 규칙 문장을 그대로 써요. 목록을 옮겨 적다 순서나 이름이 틀리는 일을 막아요.
  # recommend 추천 순위, courses 코스, plan Stage 3 전체 계획 (시나리오·노선·코스를 함께 보여 주는 답. 연계 실행의 Stage 3 포함)
  template_only_intents: [recommend, courses, plan]

sources:
  # 허브 유동인구 값은 하루 24개 시각 측정값의 합으로 보고 '시간 평균 인구(명)'으로 환산해요.
  # 실데이터에서 단위를 확인한 뒤 다르면 1.0 으로 바꾸세요.
  pop_scale: 0.0416666667
