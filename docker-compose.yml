# 머물멍을 컨테이너 둘로 띄워요: 화면·API(app) + 데이터 창고(db, PostgreSQL)  →  http://localhost:3000
#
#   docker compose up -d --build     시작 (처음에는 이미지를 만들고, 샘플 데이터를 PostgreSQL 에 넣어요)
#   docker compose up -d db          데이터 창고만 띄우기 (백엔드를 이 PC 에서 직접 돌릴 때)
#   docker compose logs -f           로그 보기
#   docker compose down              내리기 (데이터, 제안서, 실행 기록은 볼륨에 남아요)
#
# 클라우드 LLM(Claude)을 쓰려면 backend/.env 에 ANTHROPIC_API_KEY 를 넣고 다시 띄워요.
name: jeju-meomulmeong

services:
  db:
    image: postgres:17-alpine
    container_name: jeju-meomulmeong-db
    environment:
      POSTGRES_DB: meomul
      POSTGRES_USER: meomul
      # 이 PC 안에서만 여는 개발·시연용 창고의 기본 암호예요. 바꾸려면 MEOMUL_PG_PASSWORD 를 정하고 backend/.env 에도 같은 값을 넣어요.
      POSTGRES_PASSWORD: ${MEOMUL_PG_PASSWORD:-meomul}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C" # 글자 정렬이 어느 PC 에서나 같게
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5434:5432" # 이 PC 안에서만 열어요 (build-data 와 테스트가 여기로 붙어요)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meomul -d meomul"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: jeju-meomulmeong:0.1.0
    container_name: jeju-meomulmeong-app
    ports:
      - "127.0.0.1:3000:3000" # 이 PC 안에서만 열어요. 로그인 기능이 없어서 밖으로는 열지 않아요.
    env_file:
      # API 키 같은 값은 이미지에 넣지 않고, 실행할 때 backend/.env 에서 읽어 넘겨요. 파일이 없어도 떠요.
      - path: backend/.env
        required: false
    environment:
      TZ: Asia/Seoul
      MEOMUL_PG_HOST: db # 컨테이너끼리는 서비스 이름으로 붙어요
      MEOMUL_PG_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - outputs:/app/backend/outputs # 최종 제안서, 실행 기록, 평가 보고서

volumes:
  outputs:
  pgdata: # PostgreSQL 데이터 (샘플 데이터와, build-data --mode hub 로 넣은 실데이터)
