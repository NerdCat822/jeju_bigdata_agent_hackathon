# 이 PC(리눅스 · WSL2)의 Ollama 를 컨테이너에서 쓰고 싶을 때 겹쳐 쓰는 파일이에요.
#
#   docker compose -f docker-compose.yml -f docker-compose.local-llm.yml up -d --build
#
# Ollama 는 보통 127.0.0.1 에서만 듣기 때문에, 컨테이너가 호스트의 네트워크를 같이 써야 닿아요.
# 그래서 포트를 따로 열지 않고, 서버가 호스트의 127.0.0.1:3000 에서 바로 들어요 (이 PC 안에서만 열려요).
# Docker Desktop(Windows · macOS)에서는 호스트 네트워크가 다르게 동작하니 이 파일을 쓰지 마세요.
services:
  app:
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    command: ["serve", "--host", "127.0.0.1", "--port", "3000"]
    environment:
      MEOMUL_OLLAMA_HOST: http://127.0.0.1:11434
