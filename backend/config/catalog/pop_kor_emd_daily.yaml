table: pop_kor_emd_daily
title: 읍면동 단위 내국인 유동인구
stages: [1]
grain: 읍면동 × 일 × 성별 × 연령대(10세 단위)
time_column: base_date
time_grain: day
description: >
  통신 데이터로 추정한 읍면동별 내국인 유동인구예요. 거주(그 읍면동에 사는 사람), 근무(일하러 온 사람),
  방문(그 밖의 방문자)으로 나뉘어요. 청년(20·30대) 정착 진단의 기본 자료예요.
keywords: [유동인구, 생활인구, 청년, 거주, 근무, 방문, 연령, 정착, 읍면동]
columns:
  - {name: base_date, type: DATE, desc: 기준일}
  - {name: emd_cd, type: VARCHAR, desc: 행정동 코드 8자리 (ref_emd 참고)}
  - {name: sex, type: VARCHAR, desc: 성별 (남/여)}
  - {name: age_band, type: INTEGER, desc: "연령대 (0=10세 미만, 10, 20, …, 70=70세 이상)"}
  - {name: resd_pop, type: DOUBLE, desc: 거주인구 (시간 평균, 명)}
  - {name: work_pop, type: DOUBLE, desc: 근무인구 (시간 평균, 명)}
  - {name: visit_pop, type: DOUBLE, desc: 방문자수 (시간 평균, 명)}
limits:
  - 유동인구는 통신 데이터 추정치로 주민등록 인구가 아니에요.
sources:
  hub:
    dataset_id: 583
    data_key: Daaa1t3at3tt8a8DD3t55538t35Dab1t
    title: 읍면동 단위 내국인 유동인구
    dir: pop_kor_emd
    date_format: YYYYMMDD
    window: day
    place: {city: city, emd: emd}
    select:
      base_date: "std_date(baseDate)"
      sex: "std_sex(gender)"
      age_band: "std_age(ageGroup)"
      resd_pop: "TRY_CAST(resdPop AS DOUBLE) * {pop_scale}"
      work_pop: "TRY_CAST(workPop AS DOUBLE) * {pop_scale}"
      visit_pop: "TRY_CAST(visitPop AS DOUBLE) * {pop_scale}"
    aggregate: {resd_pop: sum, work_pop: sum, visit_pop: sum}
  center:
    spec_no: "4-11"
    title: 내국인 유동인구(읍면동)_v02
    file_glob: "tb_population_korean_emd_new*.csv"
    note: 시간대(01~24시) 자료를 하루 평균으로 올려 적재해요. 실제 추출본으로 검증이 필요해요.
    select:
      base_date: "std_date(base_date)"
      emd_cd: "CAST(emd_cd AS VARCHAR)"
      sex: "std_sex(sex)"
      age_band: "std_age_code(age)"
      resd_pop: "TRY_CAST(resd_pop_cnt AS DOUBLE) / 24"
      work_pop: "TRY_CAST(work_pop_cnt AS DOUBLE) / 24"
      visit_pop: "TRY_CAST(visit_pop_cnt AS DOUBLE) / 24"
    aggregate: {resd_pop: sum, work_pop: sum, visit_pop: sum}
