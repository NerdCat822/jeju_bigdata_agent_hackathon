table: card_cn_area_monthly
title: 중국인 관광객 지역·업종별 카드 이용 (월간)
stages: [2]
grain: 시군구 × 도심/읍면 × 테마 × 월
time_column: month
time_grain: month
description: >
  중국인 관광객의 카드 이용을 시군구와 도심/읍면, 업종으로 나눈 월간 자료예요.
  읍면동 단위가 없어서 읍면동을 '시군구 × 도심/읍면'으로 올려 연결해요.
  허브의 '월간 중국인관광객 카드 사용 정보'와 '중국인 관광객 지역, 업종별 카드 이용 데이터'를 여기에 적재해요.
keywords: [중국인, 관광객, 카드, 업종, 테마, 식음료, 숙박, 쇼핑, 소비, 외국인]
columns:
  - {name: month, type: DATE, desc: 기준월 (매월 1일)}
  - {name: city, type: VARCHAR, desc: 시군구 (제주시/서귀포시)}
  - {name: area_type, type: VARCHAR, desc: 도심구분 (도심/읍면)}
  - {name: theme, type: VARCHAR, desc: "테마 6종 (식음료, 숙박, 쇼핑·소매, 교통, 문화·레저, 기타)"}
  - {name: user_cnt, type: BIGINT, desc: 이용자수 (테마를 합친 값은 중복 이용자를 포함해요)}
  - {name: use_cnt, type: BIGINT, desc: 이용횟수}
  - {name: use_amt, type: BIGINT, desc: 이용금액 (원)}
limits:
  - 카드 소비는 내국인과 중국인 관광객만 포함해요.
  - 읍면동 단위가 아니라 시군구 × 도심/읍면 단위 값이에요.
sources:
  hub:
    dataset_id: 600
    data_key: tt1tDtaa0at16Daa0D60D06tDD0166t1
    title: 중국인 관광객 지역, 업종별 카드 이용 데이터
    dir: card_cn_area
    date_format: YYYYMM
    window: all
    filter: "trim(CAST(marketType AS VARCHAR)) <> '전체'"
    select:
      month: "std_month(dtYearMonth)"
      city: "trim(CAST(sigungu AS VARCHAR))"
      area_type: "trim(CAST(cityGubun AS VARCHAR))"
      theme: "std_theme(marketType)"
      user_cnt: "to_bigint(userCount)"
      use_cnt: "to_bigint(useCount)"
      use_amt: "to_bigint(useCost)"
    aggregate: {user_cnt: sum, use_cnt: sum, use_amt: sum}
